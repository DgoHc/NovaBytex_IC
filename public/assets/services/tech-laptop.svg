<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180" fill="none">
  <defs>
    <linearGradient id="screenBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#080f28"/>
    </linearGradient>
    <linearGradient id="screenArtWave" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bodyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="20%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropShadowLaptop" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowLaptop)">
    <rect x="35" y="16" width="210" height="128" rx="10" fill="url(#screenBezel)" stroke="#475569" stroke-width="1.5"/>
    <rect x="43" y="24" width="194" height="112" rx="6" fill="url(#screenGlow)"/>
    
    <path d="M43 90 C 80 50, 130 110, 180 60 C 210 30, 230 45, 237 55 L 237 136 L 43 136 Z" fill="url(#screenArtWave)"/>
    <circle cx="140" cy="80" r="32" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="M 100 136 Q 140 100 190 136 Z" fill="#38bdf8" fill-opacity="0.12"/>
    
    <path d="M44 25 L 140 25 L 44 110 Z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="140" cy="20" r="1.5" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <rect x="110" y="143" width="60" height="5" rx="2.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>

    <path d="M 18 145 L 262 145 L 272 165 C 272 168, 269 170, 265 170 L 15 170 C 11 170, 8 168, 8 165 Z" fill="url(#bodyBase)"/>
    <line x1="18" y1="145" x2="262" y2="145" stroke="url(#metalRim)" stroke-width="1.2"/>
    
    <polygon points="42,148 238,148 244,158 36,158" fill="#0f172a" fill-opacity="0.7"/>
    <line x1="46" y1="151" x2="234" y2="151" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 2"/>
    <line x1="43" y1="155" x2="237" y2="155" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7 2"/>

    <rect x="120" y="161" width="40" height="7" rx="1.5" fill="#475569" fill-opacity="0.4" stroke="#64748b" stroke-opacity="0.5" stroke-width="0.8"/>
    <line x1="15" y1="170" x2="265" y2="170" stroke="#64748b" stroke-width="1"/>
