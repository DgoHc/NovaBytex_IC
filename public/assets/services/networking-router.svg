<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180" fill="none">
  <defs>
    <linearGradient id="routerChassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a081e"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="violetAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="dropShadowRouter" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowRouter)">
    <g transform="rotate(-18, 48, 105)">
      <rect x="44" y="16" width="8" height="90" rx="4" fill="url(#antennaGrad)" stroke="#475569" stroke-width="1"/>
      <line x1="48" y1="20" x2="48" y2="60" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <rect x="96" y="10" width="8" height="95" rx="4" fill="url(#antennaGrad)" stroke="#475569" stroke-width="1"/>
    <line x1="100" y1="15" x2="100" y2="60" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="176" y="10" width="8" height="95" rx="4" fill="url(#antennaGrad)" stroke="#475569" stroke-width="1"/>
    <line x1="180" y1="15" x2="180" y2="60" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

    <g transform="rotate(18, 232, 105)">
