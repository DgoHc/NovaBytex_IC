    <path d="M 32 118 L 62 92 L 218 92 L 248 118 L 240 148 C 240 152, 236 155, 230 155 L 50 155 C 44 155, 40 152, 40 148 Z" fill="url(#routerChassis)" stroke="#4c1d95" stroke-width="1.8"/>
    
    <polygon points="68,96 212,96 226,114 54,114" fill="#0f0b29" stroke="#6d28d9" stroke-width="1"/>
    <path d="M 120 100 L 160 100 L 152 110 L 128 110 Z" fill="url(#violetAccent)" fill-opacity="0.75"/>

    <rect x="80" y="128" width="120" height="12" rx="6" fill="#09061a" stroke="#3b0764" stroke-width="1"/>
    <circle cx="95" cy="134" r="2.5" fill="#22d3ee"/>
    <circle cx="115" cy="134" r="2.5" fill="#34d399"/>
    <circle cx="135" cy="134" r="2.5" fill="#c084fc"/>
    <circle cx="155" cy="134" r="2.5" fill="#c084fc"/>
    <circle cx="175" cy="134" r="2.5" fill="#22d3ee"/>

    <line x1="45" y1="152" x2="235" y2="152" stroke="url(#violetAccent)" stroke-width="1.5" stroke-opacity="0.7"/>
